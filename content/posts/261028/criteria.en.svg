<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" role="img" aria-labelledby="title desc">
  <title id="title">Recall by answer key: final local setup vs CLOVA Speech</title>
  <desc id="desc">For each of four answer keys, a dot shows the recall of the final local setup and a bar shows the range of three CLOVA Speech runs. CLOVA Speech consensus (existing people and companies): local 89%, CLOVA Speech 94–98%. Corrected by vote, including 8 unsettled names: local 80%, CLOVA Speech 86–92%. Corrected by vote, excluding them: local 88%, CLOVA Speech 87–91%. Corrected by listening: local 84%, CLOVA Speech 82–87%.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif; }
      .row { font-size: 14px; font-weight: 400; fill: #262626; }
      .rowsub { font-size: 12px; font-weight: 400; fill: #707070; }
      .tick { font-size: 13px; font-weight: 400; fill: #707070; text-anchor: middle; }
      .value { font-size: 13px; font-weight: 700; fill: #262626; }
      .legend { font-size: 13px; font-weight: 400; fill: #262626; }
      .group { font-size: 12px; font-weight: 700; fill: #707070; }
      .grid { stroke: #e2e2e2; stroke-width: 1; }
    </style>
  </defs>
  <rect width="720" height="324" fill="#ffffff"/>
  <circle cx="306.0" cy="24" r="6" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text class="legend" x="318" y="29">Final local setup</text>
  <rect x="470" y="19" width="28" height="10" rx="5" fill="#bdbdbd"/>
  <text class="legend" x="506" y="29">Range of 3 CLOVA Speech runs</text>
  <line class="grid" x1="300.0" y1="56" x2="300.0" y2="288"/>
  <text class="tick" x="300.0" y="308">70%</text>
  <line class="grid" x1="430.0" y1="56" x2="430.0" y2="288"/>
  <text class="tick" x="430.0" y="308">80%</text>
  <line class="grid" x1="560.0" y1="56" x2="560.0" y2="288"/>
  <text class="tick" x="560.0" y="308">90%</text>
  <line class="grid" x1="690.0" y1="56" x2="690.0" y2="288"/>
  <text class="tick" x="690.0" y="308">100%</text>
  <text class="rowsub" x="20" y="308">Recall</text>
  <text class="row" x="20" y="82">CLOVA Speech consensus</text>
  <text class="rowsub" x="20" y="98">existing people &amp; companies</text>
  <rect x="612.0" y="79" width="52.0" height="10" rx="5" fill="#bdbdbd"/>
  <circle cx="547.0" cy="84" r="6" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="547.0" y="71" text-anchor="middle">89%</text>
  <text class="row" x="20" y="142">Corrected by vote</text>
  <text class="rowsub" x="20" y="158">incl. 8 unsettled</text>
  <rect x="508.0" y="139" width="78.0" height="10" rx="5" fill="#bdbdbd"/>
  <circle cx="430.0" cy="144" r="6" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="430.0" y="131" text-anchor="middle">80%</text>
  <text class="row" x="20" y="202">Corrected by vote</text>
  <text class="rowsub" x="20" y="218">excl. 8 unsettled</text>
  <rect x="521.0" y="199" width="52.0" height="10" rx="5" fill="#bdbdbd"/>
  <circle cx="534.0" cy="204" r="6" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="534.0" y="191" text-anchor="middle">88%</text>
  <text class="row" x="20" y="262">Corrected by listening</text>
  <text class="rowsub" x="20" y="278">incl. new people</text>
  <rect x="456.0" y="259" width="65.0" height="10" rx="5" fill="#bdbdbd"/>
  <circle cx="482.0" cy="264" r="6" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="482.0" y="251" text-anchor="middle">84%</text>
</svg>
