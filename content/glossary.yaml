terms:
  - key: prerender
    ko:
      name: 프리렌더
      definition: 요청이 오기 전에, 빌드할 때 페이지 HTML을 미리 만들어 두는 방식입니다.
    en:
      name: Prerender
      definition: Generating a page's HTML at build time, before any request arrives.
  - key: hydration
    ko:
      name: 하이드레이션
      definition: 서버에서 미리 만든 HTML에 브라우저의 JavaScript가 붙어 화면이 움직이기 시작하는 단계입니다.
    en:
      name: Hydration
      definition: The step where the browser's JavaScript attaches to server-rendered HTML so the page becomes interactive.
  - key: mcp
    ko:
      name: MCP
      definition: Model Context Protocol. AI 에이전트가 외부 도구와 데이터에 붙는 방법을 정한 공개 규약입니다.
    en:
      name: MCP
      definition: Model Context Protocol, an open standard for connecting AI agents to external tools and data.
  - key: transcription
    ko:
      name: 전사
      definition: 녹음된 말을 글로 옮기는 일입니다. 여기서는 음성 인식 서비스가 자동으로 합니다.
    en:
      name: Transcription
      definition: Turning recorded speech into text. Here a speech recognition API does it automatically.
  - key: prompt-injection
    ko:
      name: 프롬프트 인젝션
      definition: 메일이나 웹 페이지 같은 입력 속에 지시문을 숨겨 AI가 원래 하지 않을 일을 하게 만드는 공격입니다.
    en:
      name: Prompt injection
      definition: An attack that hides instructions inside input such as an email or web page to make an AI do something it shouldn't.
  - key: ai-agent
    ko:
      name: AI 에이전트
      definition: 말로 맡긴 일을 스스로 도구를 골라 쓰며 끝까지 해내는 AI 프로그램입니다.
    en:
      name: AI agent
      definition: An AI program that carries a task through to the end, choosing and using tools on its own.
  - key: skill
    ko:
      name: 스킬
      definition: AI 에이전트가 특정한 일을 하는 방법을 적어 둔 문서입니다. 필요할 때 꺼내 읽고 그대로 따릅니다.
    en:
      name: Skill
      definition: A document describing how an AI agent should do a specific task. The agent reads it when needed and follows it.
  - key: diffie-hellman
    ko:
      name: Diffie-Hellman 키 교환
      definition: 두 쪽이 공개해도 되는 값만 주고받고도 둘만 아는 같은 비밀 값을 얻는 방법입니다. 이 비밀 값으로 암호 키를 만듭니다.
    en:
      name: Diffie-Hellman key exchange
      definition: A method that lets two parties derive the same shared secret while exchanging only values that are safe to make public. The secret is then used to make an encryption key.
  - key: rtp
    ko:
      name: RTP
      definition: Real-time Transport Protocol. 영상과 소리 같은 실시간 데이터를 보낼 때 패킷마다 순번, 시각, 스트림 번호를 붙이는 표준입니다.
    en:
      name: RTP
      definition: Real-time Transport Protocol, a standard that tags each packet of real-time data such as video and audio with a sequence number, timestamp, and stream ID.
  - key: hash
    ko:
      name: 해시
      definition: 어떤 데이터든 정해진 길이의 값으로 줄이는 계산입니다. 데이터가 조금만 달라져도 결과가 완전히 바뀌고, 결과로 원래 데이터를 되돌릴 수 없습니다.
    en:
      name: Hash
      definition: A computation that reduces any data to a fixed-length value. A small change in the data changes the result completely, and the original data cannot be recovered from the result.
  - key: keyframe
    ko:
      name: 키프레임
      definition: 다른 프레임을 참조하지 않고 혼자서 온전히 풀리는 영상 프레임입니다. 나머지 프레임은 대부분 앞 프레임과 달라진 점만 담습니다.
    en:
      name: Keyframe
      definition: A video frame that decodes on its own without referring to other frames. Most other frames carry only what changed from earlier frames.
  - key: speaker-diarization
    ko:
      name: 화자 분리
      definition: 여러 사람이 말한 녹음에서 누가 언제 말했는지 구간을 나누는 일입니다. 화자 이름은 모르고 A, B처럼 라벨만 붙입니다.
    en:
      name: Speaker diarization
      definition: Splitting a multi-speaker recording into segments by who spoke when. It does not know the speakers' names and only labels them, such as A and B.
  - key: forced-alignment
    ko:
      name: 강제 정렬
      definition: 이미 받아 적은 글과 오디오를 맞대어, 글의 단어마다 오디오의 어느 시각에 나왔는지 찾는 일입니다.
    en:
      name: Forced alignment
      definition: Matching an existing transcript against its audio to find when each word in the text was spoken.
