# main push 또는 수동 실행으로 배포한다 (스펙 4.11). 점검 → 원격 마이그레이션 → 배포 → 스모크 → IndexNow
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    # 수동 실행도 main 일 때만 운영에 배포한다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # push 직전 커밋(IndexNow 용). 수동 실행이면 비어 있고, 새 브랜치면 0 이 40개다
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 마이그레이션은 전체 이력을, 바뀐 글은 이전 커밋과 비교한다
      - uses: pnpm/action-setup@v6 # 버전은 package.json 의 packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 점검 (게이트)
        run: pnpm audit:repo --build
      # Cloudflare 토큰은 이 두 단계에만 준다 (설치·빌드·preview 단계에는 보이지 않게)
      - name: 원격 D1 마이그레이션
        run: pnpm exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 배포
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 배포 스모크
        run: pnpm smoke https://nabichan.me
      - name: 바뀐 글 IndexNow
        if: github.event_name == 'push'
        run: |
          # 새 브랜치거나 force-push 로 이전 커밋을 받지 못했으면 건너뛴다
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "이전 커밋을 찾지 못해 건너뜀"; exit 0; fi
          pnpm indexnow --submit --base "$BEFORE" --head "$GITHUB_SHA"
